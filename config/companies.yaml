# Watchlist — the source of truth for systematic price + publication tracking.
#
# For each company:
#   - prices are snapshotted EVERY run (see priceTracker.js)
#   - each `publications` channel becomes a data source (RSS feed or X account)
#   - `secCik` adds a SEC EDGAR source (guaranteed regulated disclosures)
#
# Add a company by adding an entry. `secCik` and `feedUrl` values below are
# starting points — verify each against SEC EDGAR / the publisher.

companies:
  - ticker: NVDA
    name: NVIDIA
    aliases: [Nvidia]
    sector: Semiconductors
    secCik: "0001045810"
    publications:
      - { kind: rss, category: ai-infra, trustTier: primary, feedUrl: "https://blogs.nvidia.com/feed/" }
      - { kind: x, handle: nvidia, topics: [ai-infra] }

