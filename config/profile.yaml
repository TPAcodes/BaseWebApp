# Reader interest profile — the single tuning surface for relevance & tone.
# Keywords are matched (case-insensitive) against item title/body for the
# matching section to boost relevance; the LLM scorer also receives this.

tone: executive          # executive (terse) | analyst (longer)
maxPerSection: 6         # max items kept per section before synthesis
headlineCount: 4         # bullets in "What matters most"

# Recency window — the brief covers only this span (default: yesterday -> now,
# with Monday reaching back over the weekend). Nothing older is included.
window:
  timezone: America/New_York
  # hours: 24            # uncomment for a fixed rolling window instead of calendar
  dropUndated: true      # exclude items with no publish timestamp (can't date -> can't trust as "yesterday")

interests:
  ai-models:
    - architecture
    - training
    - scaling
    - reasoning
    - benchmark
    - model release
    - open weights
    - mixture of experts
    - context window
    - inference
  ai-infra:
    - gpu
    - accelerator
    - hbm
    - packaging
    - fab
    - foundry
    - datacenter
    - power
    - networking
    - capex
    - interconnect
  bio-robotics:
    - protein
    - drug discovery
    - clinical
    - genomics
    - humanoid
    - manipulation
    - sim-to-real
    - embodied
    - actuator
